[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-airflow"
version = "0.1.0"
description = "Airflow-inspired workflow orchestration for LLM agents: DAG scheduling, dynamic fan-out, tool governance, reflection loops and human-in-the-loop pauses."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "agentic-airflow contributors"}]
keywords = ["agents", "llm", "orchestration", "dag", "scheduler", "airflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/georgeslane/agentic-airflow"

[tool.setuptools.packages.find]
include = ["agentic_airflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
